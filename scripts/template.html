// P40-D Phase 4 — learning-flow Sankey: source_loop_id (publisher) -> namespace (adopter),
// aggregated from COMMUNITY.adoptions. Hand-rolled two-column flow diagram (no D3 dependency
// needed for a two-tier Sankey — stacking + straight bezier links is enough).
function renderCommunitySankey(adopted) {
  if (!adopted.length) {
    return `<div style="font-size:.78rem;color:var(--text-muted);font-style:italic">No adoption activity yet — this fills in as namespaces adopt shared learnings via <code>adopt-learning</code>.</div>`;
  }

  const flows = new Map(); // "source␀target" -> count
  adopted.forEach(a => {
    const src = a.source_loop_id || '?';
    const tgt = a.namespace || '?';
    const key = src + '␀' + tgt;
    flows.set(key, (flows.get(key) || 0) + 1);
  });

  const srcTotals = new Map(), tgtTotals = new Map();
  flows.forEach((count, key) => {
    const [s, t] = key.split('␀');
    srcTotals.set(s, (srcTotals.get(s) || 0) + count);
    tgtTotals.set(t, (tgtTotals.get(t) || 0) + count);
  });

  const srcList = Array.from(srcTotals.keys());
  const tgtList = Array.from(tgtTotals.keys());
  const totalFlow = Array.from(flows.values()).reduce((a, b) => a + b, 0);

  const nodeW = 14, gap = 10;
  const rows = Math.max(srcList.length, tgtList.length);
  const H = Math.max(140, rows * 34);
  const usableH = H - gap * (rows - 1);
  const unitH = usableH / totalFlow;

  const W = 720, leftX = 10, rightX = W - 10 - nodeW;

  function layout(list, totals) {
    let y = 0;
    const pos = new Map();
    list.forEach(name => {
      const h = totals.get(name) * unitH;
      pos.set(name, { y0: y, y1: y + h, h });
      y += h + gap;
    });
    return pos;
  }
  const srcPos = layout(srcList, srcTotals);
  const tgtPos = layout(tgtList, tgtTotals);
  const srcCursor = new Map(srcList.map(s => [s, srcPos.get(s).y0]));
  const tgtCursor = new Map(tgtList.map(t => [t, tgtPos.get(t).y0]));

  const palette = ['var(--blue)', 'var(--green)', 'var(--amber)', 'var(--red)'];
  const srcColor = new Map(srcList.map((s, i) => [s, palette[i % palette.length]]));

  let linksSvg = '';
  flows.forEach((count, key) => {
    const [s, t] = key.split('␀');
    const h = count * unitH;
    const sy0 = srcCursor.get(s), sy1 = sy0 + h;
    const ty0 = tgtCursor.get(t), ty1 = ty0 + h;
    srcCursor.set(s, sy1);
    tgtCursor.set(t, ty1);
    const x0 = leftX + nodeW, x1 = rightX;
    const xm = (x0 + x1) / 2;
    const path = `M${x0},${sy0} C${xm},${sy0} ${xm},${ty0} ${x1},${ty0} L${x1},${ty1} C${xm},${ty1} ${xm},${sy1} ${x0},${sy1} Z`;
    linksSvg += `<path d="${path}" fill="${srcColor.get(s)}" opacity="0.35"><title>${esc(s)} → ${esc(t)}: ${count}</title></path>`;
  });

  let nodesSvg = '';
  srcList.forEach(s => {
    const p = srcPos.get(s);
    nodesSvg += `<rect x="${leftX}" y="${p.y0}" width="${nodeW}" height="${p.h}" fill="${srcColor.get(s)}"><title>${esc(s)}: ${srcTotals.get(s)} adopted from here</title></rect>`;
    nodesSvg += `<text x="${leftX - 6}" y="${(p.y0 + p.y1) / 2}" text-anchor="end" dominant-baseline="middle" font-size="11" fill="var(--text)">${esc(s)}</text>`;
  });
  tgtList.forEach(t => {
    const p = tgtPos.get(t);
    nodesSvg += `<rect x="${rightX}" y="${p.y0}" width="${nodeW}" height="${p.h}" fill="var(--muted)"><title>${esc(t)}: ${tgtTotals.get(t)} adopted here</title></rect>`;
    nodesSvg += `<text x="${rightX + nodeW + 6}" y="${(p.y0 + p.y1) / 2}" text-anchor="start" dominant-baseline="middle" font-size="11" fill="var(--text)">${esc(t)}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" style="overflow:visible">${linksSvg}${nodesSvg}</svg>`;
}

// ── Mind Map (E25b) ──────────────────────────────────────────────────────────

function renderMindMap() {
  if (_mm.rendered) return;

  const container = document.getElementById('view-mindmap');

  const pickerHtml = NS.map((ns, i) =>

             onclick="mmSelectNs(${i})">${esc(ns.namespace)}</button>`
  ).join('');

  const hasBridges = mmHasBridges(NS[_mm.nsIdx].mindmap);
  const bridgeBtnHtml = hasBridges
    ? `<button id="mm-bridge-btn" class="mm-ns-btn${_mm.bridgesOn ? ' active' : ''}"

      <button class="mm-ns-btn" onclick="mmRotate(-30)" title="Rotate compass anticlockwise — use to bring long spines out of the SW/SE readout dead-zone" style="margin-left:auto;flex-shrink:0">⟲</button>
      <button class="mm-ns-btn" onclick="mmRotate(30)" title="Rotate compass clockwise">⟳</button>
      <button class="mm-ns-btn" onclick="mmResetView()" title="Reset zoom, pan and rotation" style="flex-shrink:0">⊙ Reset</button>
    </div>
    <div class="mm-canvas-wrap">
      <div id="mm-detail" class="mm-detail"></div>
      <svg id="mm-svg" class="mm-svg"></svg>
    </div>`;

}

function mmSelectNs(idx) {
  _mm.nsIdx = idx;
  _mm.rendered = false;
  _mm.pan = { x: 0, y: 0, scale: 1 };
  _mm.bridgesOn = false;
  const container = document.getElementById('view-mindmap');
  container.innerHTML = '';
  renderMindMap();
}

// E25e — does this namespace's learnings branch have any tag cluster annotated with
// bridge_namespaces (i.e. shared with at least one other namespace above the corpus gate)?
function mmHasBridges(data) {
  if (!data) return false;
  const learningsBranch = (data.children || []).find(c => c.id === 'learnings');
  const clusters = (learningsBranch && learningsBranch.children) || [];
  return clusters.some(c => c.bridge_namespaces && c.bridge_namespaces.length);
}

function mmToggleBridges() {
  _mm.bridgesOn = !_mm.bridgesOn;
  const btn = document.getElementById('mm-bridge-btn');
  if (btn) btn.classList.toggle('active', _mm.bridgesOn);
  mmDraw(_mm.nsIdx);
}

// Vanilla radial tree layout — no D3 needed.
// Assigns angles proportional to leaf count, positions nodes at fixed radii per depth.
function mmLayout(node, angleStart, angleEnd, depth) {
  node._angle = (angleStart + angleEnd) / 2;
  node._depth = depth;
  const children = node.children || [];
  if (!children.length) return;
  const totalLeaves = mmLeafCount(node);
  let cursor = angleStart;
  children.forEach(child => {
    const share = (mmLeafCount(child) / totalLeaves) * (angleEnd - angleStart);
    mmLayout(child, cursor, cursor + share, depth + 1);
    cursor += share;
  });
}
function mmLeafCount(node) {
  const ch = node.children || [];
  if (!ch.length) return 1;
  return ch.reduce((s, c) => s + mmLeafCount(c), 0);
}
function mmDescendants(node) {
  const out = [node];
  (node.children || []).forEach(c => out.push(...mmDescendants(c)));
  return out;
}
function mmBranch(node) {
  if (node._depth === 0) return 'root';
  let n = node;
  while (n._depth > 1 && n._parent) n = n._parent;
  return n.id || String(n.label || 'root');
}
function mmApplyTransform() {
  const g = document.getElementById('mm-root-g');
  if (g) g.setAttribute('transform', `translate(${_mm.cx + _mm.pan.x},${_mm.cy + _mm.pan.y}) scale(${_mm.pan.scale})`);
}
function mmResetView() {
  _mm.pan = { x: 0, y: 0, scale: 1 };
  _mm.rotation = 0;
  mmDraw(_mm.nsIdx);
}

// Spin the whole radial layout so long spines can be steered out of the SW/SE
// "neck-ache" zone (near-vertical text at the bottom of the circle) into the E/W
// zone where radial labels stay close to horizontal. Redraws rather than just
// re-transforming because label angles are baked into each <text> at draw time.
function mmRotate(deg) {
  _mm.rotation = (_mm.rotation + deg) % 360;
  mmDraw(_mm.nsIdx);
}
function mmLinks(node) {
  const out = [];
  (node.children || []).forEach(c => { out.push({ parent: node, child: c }); out.push(...mmLinks(c)); });
  return out;
}

function mmDraw(nsIdx) {
  const ns   = NS[nsIdx];
  const data = ns.mindmap;
  if (!data) return;

  const svg = document.getElementById('mm-svg');
  const W   = svg.clientWidth  || 900;
  const H   = svg.clientHeight || 600;
  const maxR = Math.min(W, H) / 2 - 30;

  // radii per depth proportional to available space
  const RADII = [0, maxR * 0.28, maxR * 0.55, maxR * 0.82, maxR];
  mmLayout(data, 0, 2 * Math.PI, 0);

  const rotOffset = _mm.rotation * Math.PI / 180;
  function rx(node) { return (RADII[Math.min(node._depth, RADII.length - 1)] || 0) * Math.cos(node._angle + rotOffset - Math.PI / 2); }
  function ry(node) { return (RADII[Math.min(node._depth, RADII.length - 1)] || 0) * Math.sin(node._angle + rotOffset - Math.PI / 2); }

  const branchColours = { learnings: '#58a6ff', decisions: '#f0883e', goals: '#3fb950', reality: '#bc8cff', artefacts: '#e3b341' };
  function nodeColour(node) {
    if (node._depth === 0) return '#e6edf3';
    // walk up to find branch (depth=1 ancestor)
    let n = node;
    while (n._depth > 1 && n._parent) n = n._parent;
    return branchColours[n.id] || '#8b949e';
  }

  // attach parent refs for colour walk
  function attachParents(node, parent) {
    node._parent = parent || null;
    (node.children || []).forEach(c => attachParents(c, node));
  }
  attachParents(data, null);

  // cubic bezier link between parent and child (radial feel)
  function linkPath(p, c) {
    const px = rx(p), py = ry(p), cx2 = rx(c), cy2 = ry(c);
    const mx = (px + cx2) / 2, my = (py + cy2) / 2;
    return `M${px},${py} Q${mx},${my} ${cx2},${cy2}`;
  }

  _mm.cx = W / 2; _mm.cy = H / 2;
  let svgHtml = `<g id="mm-root-g" transform="translate(${W/2 + _mm.pan.x},${H/2 + _mm.pan.y}) scale(${_mm.pan.scale})">`;

  // links
  mmLinks(data).forEach(({ parent, child }) => {
    const col = nodeColour(child);
    const branch = esc(mmBranch(child));
    svgHtml += `<path class="mm-link" d="${linkPath(parent, child)}" stroke="${col}" opacity="0.3" data-branch="${branch}"/>`;
  });

  // E25d — index every node so click/hover can look it up by a cheap integer
  // instead of round-tripping the whole subtree through an onclick attribute.
  _mm.nodeIndex = [];

  // nodes + labels
  mmDescendants(data).forEach(node => {
    const idx = _mm.nodeIndex.length;
    _mm.nodeIndex.push(node);
    const x = rx(node), y = ry(node);
    const col = nodeColour(node);
    const r   = node._depth === 0 ? 7 : node._depth === 1 ? 5 : 3;
    const isBridge = _mm.bridgesOn && node.bridge_namespaces && node.bridge_namespaces.length;
    const lbl = esc(node.label || '') + (isBridge ? ` 🔗${node.bridge_namespaces.length}` : '');
    const isGroup = !!(node.children && node.children.length);
    const tipText = isGroup ? '' : ((node.meta && (node.meta.full_text || node.label)) || node.label || '');
    const dataAttr = tipText ? `data-tip="${esc(tipText)}"` : '';
    const branch = esc(mmBranch(node));
    const clickable = node._depth >= 1;
    if (isBridge) {
      svgHtml += `<circle cx="${x}" cy="${y}" r="${r + 4}" fill="none" stroke="var(--blue)" stroke-width="1.5" stroke-dasharray="2,2" style="pointer-events:none"/>`;
    }
    svgHtml += `<circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="var(--surface)" stroke-width="1.5"
      ${dataAttr} data-idx="${idx}" data-branch="${branch}" data-depth="${node._depth}" style="cursor:${clickable ? 'pointer' : 'default'}"
      onclick="mmNodeClick(${idx}, event)"/>`;
    if (node._depth <= 2) {
      const fs = node._depth === 0 ? 13 : node._depth === 1 ? 11 : 9;
      const fw = node._depth <= 1 ? '600' : 'normal';
      // Radiate the label along its own spoke rather than drawing it flat-horizontal —
      // siblings near the top/bottom of the circle sit at very similar (x,y) but distinct
      // angles, so flat text collides while radial text fans out and stays readable.
      let angleDeg = node._depth === 0 ? 0 : (node._angle + rotOffset - Math.PI / 2) * 180 / Math.PI;
      angleDeg = ((angleDeg + 180) % 360 + 360) % 360 - 180; // normalize to [-180,180]
      let rotate = angleDeg, anchor = 'start', dx = r + 4;
      if (angleDeg > 90 || angleDeg < -90) {
        rotate = angleDeg + 180; // keep text upright on the left hemisphere
        anchor = 'end';
        dx = -(r + 4);
      }
      svgHtml += `<text x="${x}" y="${y}" dx="${dx}" text-anchor="${anchor}" dominant-baseline="middle"
        font-size="${fs}" font-weight="${fw}" fill="${col}" data-branch="${branch}" style="pointer-events:none"
        transform="rotate(${rotate.toFixed(2)} ${x} ${y})">${lbl}</text>`;
    }
  });

  svgHtml += '</g>';
  svg.innerHTML = svgHtml;

  // hover: leaves show their single-item tooltip; group nodes (branch/cluster/session)
  // show the same grouped-item list as a click would (E25d — "hover reveals the full list").
  // The detail panel is NOT cleared on mouseleave — moving the pointer off the node (e.g. to
  // reach the panel's own scrollbar, or off the SVG entirely) must not collapse it. It only
  // updates (on hovering a different node) or is dismissed explicitly (background click /
  // namespace switch) — see mmClearDetail() callers.
  svg.querySelectorAll('[data-idx]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      mmShowNodeDetail(parseInt(el.getAttribute('data-idx'), 10));
      if (el.getAttribute('data-depth') === '1') {
        const branch = el.getAttribute('data-branch');
        svg.querySelectorAll('[data-branch]').forEach(bel => {
          const b = bel.getAttribute('data-branch');
          bel.style.opacity = (b === branch || b === 'root') ? '' : '0.1';
        });
      }
    });
    el.addEventListener('mouseleave', () => {
      svg.querySelectorAll('[data-branch]').forEach(bel => { bel.style.opacity = ''; });
    });
  });

  // background click (not on a node) dismisses the detail panel
  svg.addEventListener('click', e => {
    if (e.target === svg) mmClearDetail();
  });

  // zoom via mouse wheel
  svg.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY > 0 ? 0.9 : 1.1;
    _mm.pan.scale = Math.max(0.2, Math.min(5, _mm.pan.scale * factor));
    mmApplyTransform();
  }, { passive: false });

  // pan via drag — use window listeners so drag survives leaving the SVG bounds
  svg.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    _mm.drag.active = true;
    _mm.drag.sx = e.clientX - _mm.pan.x;
    _mm.drag.sy = e.clientY - _mm.pan.y;
    svg.style.cursor = 'grabbing';
  });
  if (_mm._onMouseMove) window.removeEventListener('mousemove', _mm._onMouseMove);
  if (_mm._onMouseUp)   window.removeEventListener('mouseup',   _mm._onMouseUp);
  _mm._onMouseMove = e => {
    if (!_mm.drag.active) return;
    _mm.pan.x = e.clientX - _mm.drag.sx;
    _mm.pan.y = e.clientY - _mm.drag.sy;
    mmApplyTransform();
  };
  _mm._onMouseUp = () => {
    _mm.drag.active = false;
    const s = document.getElementById('mm-svg');
    if (s) s.style.cursor = 'grab';
  };
  window.addEventListener('mousemove', _mm._onMouseMove);
  window.addEventListener('mouseup',   _mm._onMouseUp);
  svg.style.cursor = 'grab';
}

const MM_LIST_CAP = 100;

// E25d — click or hover on a count node (e.g. "Learnings (57)", "tooling (12)") reveals
// the full flattened list of its leaf descendants, instead of just a single tooltip line.
function mmShowNodeDetail(idx) {
  const node = _mm.nodeIndex && _mm.nodeIndex[idx];
  const detail = document.getElementById('mm-detail');
  if (!node || !detail) return;

  const isGroup = !!(node.children && node.children.length);
  const meta = node.meta || {};

  // A "leaf" can still represent a count worth expanding (e.g. a reality section's
  // bullet list) — treat any node carrying a non-empty items array the same as a group.
  const metaItems = Array.isArray(meta.bullets) ? meta.bullets : null;

  // E25e — bridge info: shown whenever the toggle is on and this cluster has bridge_namespaces,
  // regardless of which detail branch below ends up rendering the rest of the panel.
  const bridgeHtml = (_mm.bridgesOn && node.bridge_namespaces && node.bridge_namespaces.length)
    ? `<div class="mm-list-bridge">🔗 Also tagged in: ${node.bridge_namespaces.map(b => `${esc(b.namespace)} (${b.count})`).join(', ')}</div>`
    : '';

  if (!isGroup && !(metaItems && metaItems.length)) {
    detail.classList.remove('mm-detail-list');
    const lines = [node.label || ''];
    if (meta.full_text && meta.full_text !== node.label) lines.push(meta.full_text);
    if (meta.weight)        lines.push(`Weight: ${meta.weight}`);
    if (meta.learning_type) lines.push(`Type: ${meta.learning_type}`);
    if (meta.rationale)     lines.push(`Rationale: ${meta.rationale}`);
    if (meta.bullet_count !== undefined) lines.push(`${meta.bullet_count} bullet(s)`);
    detail.textContent = lines.join(' · ');
    return;
  }

  if (metaItems && metaItems.length) {
    const shown = metaItems.slice(0, MM_LIST_CAP);
    const items = shown.map(b => `<li>${esc(b)}</li>`).join('');
    const more  = metaItems.length > MM_LIST_CAP
      ? `<li class="mm-list-more">+${metaItems.length - MM_LIST_CAP} more</li>` : '';
    detail.classList.add('mm-detail-list');
    detail.innerHTML = `<div class="mm-list-title">${esc(node.label || '')} — ${metaItems.length} bullet${metaItems.length !== 1 ? 's' : ''}</div>${bridgeHtml}<ul>${items}${more}</ul>`;
    return;
  }

  const leaves = mmDescendants(node).filter(d => !(d.children && d.children.length));
  const shown  = leaves.slice(0, MM_LIST_CAP);
  const items  = shown.map(l => `<li>${esc(l.label || '')}</li>`).join('');
  const more   = leaves.length > MM_LIST_CAP
    ? `<li class="mm-list-more">+${leaves.length - MM_LIST_CAP} more</li>` : '';
  detail.classList.add('mm-detail-list');
  detail.innerHTML = `<div class="mm-list-title">${esc(node.label || '')} — ${leaves.length} item${leaves.length !== 1 ? 's' : ''}</div>${bridgeHtml}<ul>${items}${more}</ul>`;
}

function mmClearDetail() {
  const detail = document.getElementById('mm-detail');
  if (!detail) return;
  detail.classList.remove('mm-detail-list');
  detail.textContent = '';
}

function mmNodeClick(idx, ev) {
  if (ev) ev.stopPropagation();
  mmShowNodeDetail(idx);
}

function renderDAG() {
  if (_dag.raf) { cancelAnimationFrame(_dag.raf); _dag.raf = null; }

  // Re-activation: DOM already exists — resume sim from current positions, don't rebuild
  if (_dag.rendered) {
    if (_dag.tick < _dag.maxTick) _dag.raf = requestAnimationFrame(dagSimStep);
    dagUpdatePositions();
    return;
  }

  const container = document.getElementById('view-dag');
  const nodeData = NS.map((ns, i) => ({ ns, nsIdx: i, x: 0, y: 0, vx: 0, vy: 0, fixed: false }))
    .filter(n => _dag.showSystem || !SYSTEM_NS.has(n.ns.namespace.toLowerCase()));
  if (!nodeData.length) {
    container.innerHTML = '<div class="empty-state" style="padding:2rem;text-align:center">No namespaces to visualise.</div>';
    return;
  }
  const allEdges = computeAllEdges(_dag.showSystem)
    .filter(e => nodeData.some(n => n.nsIdx === e.source) && nodeData.some(n => n.nsIdx === e.target));
  const nodeMap = new Map(nodeData.map((n, i) => [n.nsIdx, i]));
  // Canvas grows with node count so dense graphs get breathing room instead of a fixed 900x530.
  _dag.svgW = Math.max(900, Math.min(1800, 700 + nodeData.length * 40));
  _dag.svgH = Math.max(530, Math.min(1200, 420 + nodeData.length * 28));
  const W = _dag.svgW, H = _dag.svgH;
  dagComputeVisualEncoding(nodeData, allEdges, nodeMap);
  Object.assign(_dag, { nodes: nodeData, edges: allEdges, nodeMap, tick: 0 });
  dagInitPositions();

  const sysLabel = _dag.showSystem ? 'Hide system NS' : 'Show system NS';
  const sysCls   = _dag.showSystem ? ' active' : '';
  container.innerHTML = ''
    + '<div class="dag-toolbar">'
    +   '<span class="dag-title">Dependency Graph</span>'
    +   '<span class="dag-hint">Drag nodes · hover edges for details · click node for chain</span>'
    +   '<button class="dag-btn' + sysCls + '" id="dag-sys-btn" onclick="toggleDAGSystem()">&#x2699; ' + sysLabel + '</button>'
    +   '<button class="dag-btn" onclick="resetDAGLayout()">&#x21ba; Reset</button>'
    + '</div>'
    + '<div class="dag-wrap">'
    +   '<svg id="dag-svg" viewBox="0 0 ' + W + ' ' + H + '" class="dag-svg" preserveAspectRatio="xMidYMid meet"></svg>'
    +   '<div id="dag-chain" class="dag-chain"></div>'
    +   '<div class="dag-legend">' + buildDAGLegend(allEdges) + '</div>'
    + '</div>'
    + '<div id="dag-tooltip" class="dag-tooltip" style="display:none"></div>';

  const svgEl = document.getElementById('dag-svg');
  const SVG   = 'http://www.w3.org/2000/svg';

  // Arrowhead markers in defs
  const defs = document.createElementNS(SVG, 'defs');
  Object.entries(EDGE_META).forEach(([type, m]) => {
    if (!m.arrow) return;
    const mk = document.createElementNS(SVG, 'marker');
    mk.setAttribute('id', 'arr-' + type); mk.setAttribute('markerWidth', '8'); mk.setAttribute('markerHeight', '6');
    mk.setAttribute('refX', '7'); mk.setAttribute('refY', '3'); mk.setAttribute('orient', 'auto');
    const poly = document.createElementNS(SVG, 'polygon');
    poly.setAttribute('points', '0,0 8,3 0,6'); poly.setAttribute('fill', m.color);
    mk.appendChild(poly); defs.appendChild(mk);
  });
  svgEl.appendChild(defs);

  // Edge lines
  const eg = document.createElementNS(SVG, 'g');
  allEdges.forEach((e, ei) => {
    const m = EDGE_META[e.type] || EDGE_META.shared;
    const ln = document.createElementNS(SVG, 'line');
    ln.setAttribute('id', 'dag-edge-' + ei);
    ln.setAttribute('stroke', m.color); ln.setAttribute('stroke-width', '1.5');
    ln.setAttribute('stroke-opacity', '0.65');
    if (m.dash) ln.setAttribute('stroke-dasharray', m.dash);
    if (m.arrow) ln.setAttribute('marker-end', 'url(#arr-' + e.type + ')');
    // Wider hover area via a transparent overlay
    const hit = document.createElementNS(SVG, 'line');
    hit.setAttribute('id', 'dag-hit-' + ei);
    hit.setAttribute('stroke', 'transparent'); hit.setAttribute('stroke-width', '10');
    const showTip = ev => {
      const tt = document.getElementById('dag-tooltip');
      if (!tt) return;
      const arrow = m.arrow ? ' → ' : ' ↔ ';
      const nsA = NS[e.source]?.namespace || '?', nsB = NS[e.target]?.namespace || '?';
      const dets = e.details.slice(0,4).map(d => '<div class="dag-tip-detail">• ' + esc(d) + '</div>').join('');
      tt.innerHTML = '<div class="dag-tip-header"><span class="dag-tip-type dag-tip-' + e.type + '">' + esc(m.label) + '</span>'
        + '<span style="color:var(--muted)">' + esc(nsA) + arrow + esc(nsB) + '</span></div>' + dets;
      tt.style.display = 'block'; dagPosTooltip(ev, tt);
    };
    const hideTip = () => { const tt = document.getElementById('dag-tooltip'); if (tt) tt.style.display = 'none'; };
    [ln, hit].forEach(el => {
      el.addEventListener('mouseenter', showTip);
      el.addEventListener('mousemove', ev => dagPosTooltip(ev, document.getElementById('dag-tooltip')));
      el.addEventListener('mouseleave', hideTip);
    });
    eg.appendChild(ln); eg.appendChild(hit);
  });
  svgEl.appendChild(eg);

  // Node groups
  const ng = document.createElementNS(SVG, 'g');
  nodeData.forEach((n, ni) => {
    const isSys = SYSTEM_NS.has(n.ns.namespace.toLowerCase());
    const g = document.createElementNS(SVG, 'g');
    g.setAttribute('id', 'dag-node-' + ni); g.style.cursor = 'pointer';
    g.setAttribute('opacity', String(n.fade != null ? n.fade : 1));
    const r = n.r || 28;

    const circ = document.createElementNS(SVG, 'circle');
    circ.setAttribute('r', r.toFixed(1));
    circ.setAttribute('fill', n.ns.open ? 'rgba(63,185,80,.18)' : isSys ? 'rgba(22,27,34,.95)' : 'rgba(33,38,45,.9)');
    circ.setAttribute('stroke', n.ns.open ? '#3fb950' : isSys ? '#58a6ff' : '#484f58');
    circ.setAttribute('stroke-width', n.ns.open ? '2' : isSys ? '1.5' : '1');
    if (isSys) circ.setAttribute('stroke-dasharray', '3,2');
    g.appendChild(circ);

    // Goal-rate dot (top-right) — offset scales with node radius
    if (n.ns.goalRate !== null && n.ns.goalRate !== undefined) {
      const dot = document.createElementNS(SVG, 'circle');
      const off = (r * 0.71).toFixed(1);
      dot.setAttribute('r', '5'); dot.setAttribute('cx', off); dot.setAttribute('cy', '-' + off);
      dot.setAttribute('fill', n.ns.goalRate >= 80 ? '#3fb950' : n.ns.goalRate >= 50 ? '#d29922' : '#f85149');
      dot.setAttribute('stroke', '#0d1117'); dot.setAttribute('stroke-width', '1.5');
      g.appendChild(dot);
    }

    // Namespace name — split at hyphens for readability
    const nm   = n.ns.namespace;
    const segs = nm.split('-');
    const rows = segs.length >= 3
      ? [segs.slice(0, Math.ceil(segs.length/2)).join('-'), segs.slice(Math.ceil(segs.length/2)).join('-')]
      : [nm];
    rows.forEach((row, ri) => {
      const t = document.createElementNS(SVG, 'text');
      t.setAttribute('text-anchor', 'middle'); t.setAttribute('dominant-baseline', 'middle');
      t.setAttribute('font-size', rows.length > 1 ? '9' : '10.5');
      t.setAttribute('font-family', 'ui-monospace, monospace');
      t.setAttribute('fill', isSys ? '#8b949e' : '#e6edf3');
      t.setAttribute('pointer-events', 'none');
      t.setAttribute('y', rows.length > 1 ? (ri === 0 ? '-6' : '7') : '0');
      t.textContent = row.length > 14 ? row.slice(0,13) + '…' : row;
      g.appendChild(t);
    });

    // Session count below circle
    if (n.ns.sessionCount > 0) {
      const sc = document.createElementNS(SVG, 'text');
      sc.setAttribute('text-anchor', 'middle'); sc.setAttribute('y', (r + 14).toFixed(1));
      sc.setAttribute('font-size', '9'); sc.setAttribute('fill', '#484f58');
      sc.setAttribute('pointer-events', 'none');
      sc.textContent = n.ns.sessionCount + '×';
      g.appendChild(sc);
    }

    g.addEventListener('click', ev => { ev.stopPropagation(); applyDAGFocus(n.nsIdx); });
    g.addEventListener('mousedown', ev => { ev.preventDefault(); startDagDrag(ev, ni); });
    ng.appendChild(g);
  });
  svgEl.appendChild(ng);

  _dag.rendered = true;
  _dag.raf = requestAnimationFrame(dagSimStep);
  dagUpdatePositions();
}

function toggleDAGSystem() {
  _dag.showSystem = !_dag.showSystem;
  _dag.rendered = false;
  renderDAG();
}

function applyDAGFocus(nsIdx) {
  _dag.focusedNs = nsIdx;
  const ns = NS[nsIdx];
  if (!ns) return;

  // Partition edges by type and direction
  const blocksOthers = _dag.edges.filter(e => e.type === 'blocking' && e.source === nsIdx);
  const blockedBy    = _dag.edges.filter(e => e.type === 'blocking' && e.target === nsIdx);
  const dependsOn    = _dag.edges.filter(e => e.type === 'dep' && e.source === nsIdx);
  const referencedBy = _dag.edges.filter(e => e.type === 'dep' && e.target === nsIdx);

  const focusEdgeIdxs = new Set();
  _dag.edges.forEach((e, i) => {
    if ((e.type === 'blocking' || e.type === 'dep') && (e.source === nsIdx || e.target === nsIdx))
      focusEdgeIdxs.add(i);
  });

  // Dim / highlight edges
  _dag.edges.forEach((e, i) => {
    const ln = document.getElementById('dag-edge-' + i);
    if (!ln) return;
    if (focusEdgeIdxs.has(i)) {
      ln.setAttribute('stroke-opacity', '1');
      ln.setAttribute('stroke-width', '2.5');
    } else {
      ln.setAttribute('stroke-opacity', '0.12');
      ln.setAttribute('stroke-width', '1.5');
    }
  });

  // Build chain sidebar
  const chain = document.getElementById('dag-chain');
  if (!chain) return;

  const _chainItem = (nsName, reason) =>
    `<div class="dag-chain-item"><span class="chain-ns">${esc(nsName)}</span>`
    + (reason ? `<div class="chain-reason">${esc(reason.slice(0, 80))}</div>` : '')
    + '</div>';

  const blocksSect = blocksOthers.length
    ? '<div class="dag-chain-section">Blocks</div>'
      + blocksOthers.map(e => _chainItem(NS[e.target]?.namespace || '?', (e.details||[])[0]||'')).join('')
    : '';

  const blockedSect = blockedBy.length
    ? '<div class="dag-chain-section">Blocked by</div>'
      + blockedBy.map(e => _chainItem(NS[e.source]?.namespace || '?', (e.details||[])[0]||'')).join('')
    : '';

  const depOnSect = dependsOn.length
    ? '<div class="dag-chain-section">Depends on</div>'
      + dependsOn.map(e => _chainItem(NS[e.target]?.namespace || '?', (e.details||[])[0]||'')).join('')
    : '';

  const refBySect = referencedBy.length
    ? '<div class="dag-chain-section">Referenced by</div>'
      + referencedBy.map(e => _chainItem(NS[e.source]?.namespace || '?', (e.details||[])[0]||'')).join('')
    : '';

  const emptySect = (!blocksOthers.length && !blockedBy.length && !dependsOn.length && !referencedBy.length)
    ? '<div class="dag-chain-empty">No dependency edges</div>'
    : '';

  chain.innerHTML = `<div class="dag-chain-title">Work chain</div>`
    + `<div class="dag-chain-ns">${esc(ns.namespace)}</div>`
    + blocksSect + blockedSect + depOnSect + refBySect + emptySect
    + `<div class="dag-chain-nav">`
    +   `<button class="dag-chain-btn" onclick="switchView('overview');selectCard(${nsIdx},{force:true})">Open →</button>`
    +   `<button class="dag-chain-btn" onclick="clearDAGFocus()">✕</button>`
    + `</div>`;
  chain.classList.add('visible');
}

function clearDAGFocus() {
  _dag.focusedNs = null;
  const chain = document.getElementById('dag-chain');
  if (chain) chain.classList.remove('visible');
  // Restore all edge opacities
  _dag.edges.forEach((e, i) => {
    const ln = document.getElementById('dag-edge-' + i);
    if (ln) { ln.setAttribute('stroke-opacity', '0.65'); ln.setAttribute('stroke-width', '1.5'); }
  });
}

// Node radius encodes importance (weighted degree + session activity + open bonus),
// min-max normalised across the current node set into an 18-40px range.
// Fill opacity encodes staleness (days since the namespace's most recent session).
function dagComputeVisualEncoding(nodeData, edges, nodeMap) {
  const DEGREE_WEIGHT = { dep: 3, blocking: 3, conflict: 2, shared: 1, concurrent: 1 };
  const degree = new Array(nodeData.length).fill(0);
  edges.forEach(e => {
    const ai = nodeMap.get(e.source), bi = nodeMap.get(e.target);
    const w = DEGREE_WEIGHT[e.type] || 1;
    if (ai != null) degree[ai] += w;
    if (bi != null) degree[bi] += w;
  });
  const scores = nodeData.map((n, i) => degree[i] + Math.min(n.ns.sessionCount || 0, 20) + (n.ns.open ? 15 : 0));
  const minS = Math.min(...scores), maxS = Math.max(...scores), range = maxS - minS || 1;
  const now = Date.now();
  nodeData.forEach((n, i) => {
    n.r = scores.length > 1 ? 18 + (scores[i] - minS) / range * 22 : 28;
    const dates = n.ns.sessionDates || [];
    if (!dates.length) { n.fade = 0.3; return; }
    const staleDays = (now - Math.max(...dates.map(d => new Date(d).getTime()))) / 86400000;
    n.fade = staleDays <= 30 ? 1 : staleDays <= 90 ? 0.55 : 0.3;
  });
}

// Seed positions using topological layers (dep/conflict edges determine depth).
// All nodes with no incoming directed edges become roots (top); leaves sink to bottom.
// Nodes sharing a layer are spread evenly across the full canvas width.
function dagInitPositions() {
  const { nodes, edges, nodeMap, svgW, svgH } = _dag;
  const W = svgW, H = svgH, N = nodes.length;
  const inDeg = new Array(N).fill(0);
  const adj   = Array.from({length: N}, () => []);
  edges.forEach(e => {
    if (e.type !== 'dep' && e.type !== 'conflict') return;
    const ai = nodeMap.get(e.source), bi = nodeMap.get(e.target);
    if (ai == null || bi == null) return;
    inDeg[bi]++; adj[ai].push(bi);
  });
  const layer = new Array(N).fill(0);
  const q = []; inDeg.forEach((d, i) => { if (d === 0) q.push(i); });
  for (let qi = 0; qi < q.length; qi++) {
    const cur = q[qi];
    adj[cur].forEach(nb => {
      layer[nb] = Math.max(layer[nb], layer[cur] + 1);
      inDeg[nb]--;
      if (inDeg[nb] === 0) q.push(nb);
    });
  }
  const maxLayer = Math.max(...layer, 0);
  // Group node indices by layer, then sort within a layer by dominant tag so
  // tag-related namespaces seed in adjacent slots — the shared-tag springs in
  // dagSimStep then only need a small pull to cluster them, instead of dragging
  // them across the whole canvas from a random starting slot.
  const byLayer = Array.from({length: maxLayer + 1}, () => []);
  nodes.forEach((n, i) => byLayer[layer[i]].push(i));
  byLayer.forEach(group => group.sort((a, b) => {
    const ta = (nodes[a].ns.topTags || [])[0] || '', tb = (nodes[b].ns.topTags || [])[0] || '';
    return ta.localeCompare(tb);
  }));
  const PAD = 72;
  byLayer.forEach((group, l) => {
    const cnt = group.length;
    group.forEach((i, idx) => {
      const n = nodes[i];
      n.x = PAD + (W - PAD*2) * (idx + 0.5) / cnt + (Math.random() - 0.5) * 18;
      n.y = PAD + (H - PAD*2) * (maxLayer > 0 ? l / maxLayer : 0.5) + (Math.random() - 0.5) * 18;
      n.vx = 0; n.vy = 0;
    });
  });
}

function dagSimStep() {
  const { nodes, edges, nodeMap, svgW, svgH } = _dag;
  const cx = svgW/2, cy = svgH/2;
  // Edge-type-aware spring lengths: tighter for hard dependencies, looser for concurrent.
  // 'shared' (tag-overlap) is nudged tighter than the original tuning so tag-related
  // namespaces drift closer, but only slightly — this graph's namespaces mostly share
  // a common tag pool, so over-tightening 'shared' collapses everything into one blob
  // instead of producing readable clusters.
  const SPRING_LEN = { dep: 110, shared: 150, conflict: 90, concurrent: 195 };
  const SPRING_K   = { dep: 0.03, shared: 0.020, conflict: 0.038, concurrent: 0.012 };
  // Repulsion scales with canvas area — a canvas 4x the baseline size needs ~4x the
  // repulsion to fill it; otherwise the (linearly-growing-with-distance) spring forces
  // dominate over long distances and pull every node into a single tight clump.
  const REPEL = 14000 * (svgW * svgH) / (900 * 530), DAMP = 0.80, CENT = 0.002;
  const MAX_SPRING_F = 40;

  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      const dx = nodes[j].x - nodes[i].x || 0.01, dy = nodes[j].y - nodes[i].y || 0.01;
      const d = Math.sqrt(dx*dx + dy*dy) || 1, f = REPEL / (d*d);
      const fx = dx/d*f, fy = dy/d*f;
      if (!nodes[i].fixed) { nodes[i].vx -= fx; nodes[i].vy -= fy; }
      if (!nodes[j].fixed) { nodes[j].vx += fx; nodes[j].vy += fy; }
    }
  }
  edges.forEach(e => {
    const ai = nodeMap.get(e.source), bi = nodeMap.get(e.target);
    if (ai == null || bi == null) return;
    const a = nodes[ai], b = nodes[bi];
    const slen = SPRING_LEN[e.type] || 150;
    const sk   = SPRING_K[e.type]   || 0.02;
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = Math.max(-MAX_SPRING_F, Math.min(MAX_SPRING_F, sk * (d - slen)));
    const fx = dx/d*f, fy = dy/d*f;
    if (!a.fixed) { a.vx += fx; a.vy += fy; }
    if (!b.fixed) { b.vx -= fx; b.vy -= fy; }
  });
  let ke = 0;
  nodes.forEach(n => {
    if (!n.fixed) { n.vx += (cx - n.x) * CENT; n.vy += (cy - n.y) * CENT; }
    n.vx *= DAMP; n.vy *= DAMP;
    if (!n.fixed) {
      const mx = (n.r || 28) + 12, my = (n.r || 28) + 7;
      n.x = Math.max(mx, Math.min(svgW - mx, n.x + n.vx));
      n.y = Math.max(my, Math.min(svgH - my, n.y + n.vy));
    }
    ke += n.vx*n.vx + n.vy*n.vy;
  });
  dagUpdatePositions();
  _dag.tick++;
  if (_dag.tick < _dag.maxTick && ke > 0.02)
    _dag.raf = requestAnimationFrame(dagSimStep);
}

function dagUpdatePositions() {
  const { nodes, edges, nodeMap } = _dag;
  edges.forEach((e, ei) => {
    const ai = nodeMap.get(e.source), bi = nodeMap.get(e.target);
    if (ai == null || bi == null) return;
    const a = nodes[ai], b = nodes[bi];
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx*dx + dy*dy) || 1;
    const startR = (a.r || 28) + 2, endR = EDGE_META[e.type]?.arrow ? (b.r || 28) + 4 : 0;
    const x1 = a.x + dx/d*startR, y1 = a.y + dy/d*startR;
    const x2 = b.x - dx/d*endR,   y2 = b.y - dy/d*endR;
    const ln  = document.getElementById('dag-edge-' + ei);
    const hit = document.getElementById('dag-hit-'  + ei);
    [ln, hit].forEach(el => {
      if (!el) return;
      el.setAttribute('x1', x1.toFixed(1)); el.setAttribute('y1', y1.toFixed(1));
      el.setAttribute('x2', x2.toFixed(1)); el.setAttribute('y2', y2.toFixed(1));
    });
  });
  nodes.forEach((n, ni) => {
    const g = document.getElementById('dag-node-' + ni);
    if (g) g.setAttribute('transform', 'translate(' + n.x.toFixed(1) + ',' + n.y.toFixed(1) + ')');
  });
}

function startDagDrag(ev, ni) {
  const svg = document.getElementById('dag-svg');
  if (!svg) return;
  const bb = svg.getBoundingClientRect();
  const sx = _dag.svgW / bb.width, sy = _dag.svgH / bb.height;
  _dag.drag = { ni, ox: ev.clientX, oy: ev.clientY, nx: _dag.nodes[ni].x, ny: _dag.nodes[ni].y, sx, sy };
  _dag.nodes[ni].fixed = true;
  if (_dag.raf) { cancelAnimationFrame(_dag.raf); _dag.raf = null; }
  const onMove = e => {
    if (!_dag.drag) return;
    const dn = _dag.nodes[_dag.drag.ni];
    const mx = (dn.r || 28) + 12, my = (dn.r || 28) + 7;
    dn.x = Math.max(mx, Math.min(_dag.svgW - mx, _dag.drag.nx + (e.clientX-_dag.drag.ox)*_dag.drag.sx));
    dn.y = Math.max(my, Math.min(_dag.svgH - my, _dag.drag.ny + (e.clientY-_dag.drag.oy)*_dag.drag.sy));
    dagUpdatePositions();
  };
  const onUp = () => {
    _dag.drag = null;
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    _dag.tick = 0; _dag.raf = requestAnimationFrame(dagSimStep);
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

function resetDAGLayout() {
  _dag.nodes.forEach(n => { n.fixed = false; });
  dagInitPositions();
  if (_dag.raf) cancelAnimationFrame(_dag.raf);
  _dag.tick = 0; _dag.raf = requestAnimationFrame(dagSimStep);
}

// Auto-open first card when only one namespace is shown
if (NS.length === 1) selectCard(0);

// ── Global exposure — functions invoked from inline HTML attributes
// (onclick/oninput/onkeydown) must be reachable from window; everything else
// stays module-private inside this IIFE to prevent silent name collisions.
// decSort/decExpand are NOT listed here — they self-assign to window at their
// definition site inside renderDecisionsView() (closures over local render state).
Object.assign(window, {
  switchView, switchTab, switchHeatmap, selectCard, setFilter,
  toggleSession, filterLearningType,
  openSearch, closeSearch, closeSearchIfBackdrop, handleSearch, handleSearchKey, handleResultClick,
  toggleDAGSystem, resetDAGLayout, clearDAGFocus,
  mmNodeClick, mmResetView, mmSelectNs, mmToggleBridges, mmRotate,
});
})();
</script>
